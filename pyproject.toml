[project]
name = "diayn-min"
version = "0.1.0"
description = "Minimal replication of DIAYN (Eysenbach et al., 2018): 2D navigation, InvertedPendulum, and the N:M update-ratio study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "gymnasium[mujoco]>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "imageio>=2.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diayn"]
